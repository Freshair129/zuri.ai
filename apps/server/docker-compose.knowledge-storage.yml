# TASK-ZAI-049 — self-hosted S3-compatible endpoint overlay.
#
# This file is a deployment template. It is intentionally not part of the base
# compose project and it has no image, host path or credential defaults. Before
# use, the operator must record the pinned provider image digest and the primary
# volume in deploy/knowledge-storage/target.json.example (copied to the private
# target receipt). The backup target is a separate host and is not represented by
# a second service in this file: a second container on this host is not a backup
# failure domain.
#
# The provider admin env file is mounted only into this container. The application
# access key/secret belong in .env.knowledge and are never the provider root key.
# The API and admin console are reachable only on zuri-network; neither is
# published through the host or ngrok.
services:
  knowledge-storage:
    profiles: ["knowledge-storage"]
    image: ${ZURI_KNOWLEDGE_STORAGE_IMAGE:?Set an approved provider image@sha256:digest}
    command: ["server", "/data", "--console-address", ":9001"]
    restart: unless-stopped
    env_file:
      - path: ${ZURI_KNOWLEDGE_STORAGE_ADMIN_ENV_FILE_HOST:?Set an admin env file outside the checkout}
        required: true
    volumes:
      - type: bind
        source: ${ZURI_KNOWLEDGE_STORAGE_DATA_DIR_HOST:?Set a dedicated primary data path}
        target: /data
        read_only: false
        bind:
          create_host_path: false
    expose:
      - "9000"
      - "9001"
    networks:
      - zuri-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
