# docker-compose.yml — zuri-ai without Vercel (ADR-058).
#
#   Internet ──► ngrok HTTPS endpoint ──► ngrok container ──► web:3000 (Next.js: UI + API + LINE seam)
#                                                              │
#                                        (profile local-db)    └──► db:5432 (Postgres, volume db-data)
#                                                            or an external Postgres (Supabase) via DATABASE_URL
#
# Real services only: this repository is ONE Next.js app. There is no separate API,
# gateway or Redis. The optional line-server worker ticks durable database jobs; the
# legacy forwarding seam (`POST /api/agent/line-webhook`), account-scoped Server
# webhook and the console are served by `web`.
#
# Configuration:
#   .env         — required; interpolates this file and is the web container's env_file
#   .env.docker  — optional; container-only overrides (e.g. a Postgres DATABASE_URL while
#                  .env keeps SQLite for `npm run dev`). Never committed (.gitignore: .env*).
#   COMPOSE_PROFILES=local-db in .env starts the bundled Postgres + schema push.
#
# Nothing here contains a credential: every secret is a ${VARIABLE} or comes from env_file.

name: zuri-ai

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    # A registry tag lets a later VPS `docker compose pull web` instead of building
    # (see .github/workflows/docker-image.yml). Local builds keep the :local tag.
    image: ${ZURI_WEB_IMAGE:-zuri-ai-web:local}
    restart: unless-stopped
    # Post-acknowledgement admission (FR-149) can run ~40s after the webhook already answered
    # LINE (4s + 12s retry delays, three attempts of 7-11s each). Docker's default 10s SIGKILLs
    # the process mid-admission on every `docker compose up -d --build web` deploy, and the
    # customer's message is lost with no trace.
    stop_grace_period: 60s
    env_file:
      - path: .env
        required: true
      - path: .env.docker
        required: false
      # ADR-075 Phase 3 §7 — the knowledge settings live in ONE file that both web
      # and genesis-worker read, so the shared credentials cannot drift between two
      # copies. Optional here and required there: web runs perfectly well without it
      # (admission stays 503), the worker cannot run at all without it. Gitignored;
      # .env.knowledge.example lists every name.
      - path: .env.knowledge
        required: false
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      # The one public-origin variable (src/lib/public-base-url.js). Explicit
      # PUBLIC_BASE_URL wins; otherwise the static ngrok domain; otherwise localhost.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-${NGROK_DOMAIN:+https://${NGROK_DOMAIN}}}
      # The Supabase CA bundle ships in the image (Dockerfile), so a Windows path in
      # .env cannot leak into the container.
      ZURI_LINE_DB_CA_FILE: /app/certs/supabase-prod-ca-2021.crt
      ZURI_CUSTOMER_REVIEW_DB_CA_FILE: /app/certs/supabase-prod-ca-2021.crt
    ports:
      # Loopback by default: the public path is ngrok, not the host's LAN interface.
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    healthcheck:
      # FR-142 — one trivial query against the configured database, no session needed.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
        required: false
      db-migrate:
        condition: service_completed_successfully
        required: false
    networks:
      - zuri-network
    volumes:
      # ADR-075 Phase 3 §6 — msp.sqlite and gks.sqlite. Both MSP sides and every GKS
      # child must open the SAME files with working locks (C8), which a Windows bind
      # mount through Docker Desktop's file-sharing layer cannot give them, so this is
      # a NAMED volume on the one ext4 filesystem inside Docker's WSL2 VM. web mounts
      # only this one; the native store and the model belong to the worker alone.
      # Harmless while the knowledge profile is off: an empty directory nothing reads.
      - ki17-state:/var/lib/zuri-ki17/state
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # FR-149: optional server worker. The web service keeps transport credentials;
  # this process only calls the authenticated work endpoint and has no secret mount.
  line-worker:
    image: ${ZURI_WEB_IMAGE:-zuri-ai-web:local}
    profiles: ["line-server"]
    restart: unless-stopped
    command: ["node", "scripts/server-line-worker.mjs"]
    environment:
      ZURI_LINE_WORKER_URL: http://web:3000/api/line-oa/worker
      ZURI_LINE_WORKER_TOKEN: ${ZURI_LINE_WORKER_TOKEN:-}
    depends_on:
      web:
        condition: service_healthy
    networks:
      - zuri-network
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # ADR-075 Phase 3 (P-4) — the GenesisRAG17 Tier 4 worker, as a Linux sidecar in
  # web's network namespace. docs/plans/GENESISRAG17-EDGE-DEPLOYMENT.md option (a).
  #
  # OFF BY DEFAULT and deliberately so: the `knowledge` profile means no `docker
  # compose up` that does not name it can start this, and Phase 3 routes no customer
  # traffic through it (§11). Starting it is step 3 of an owner-triggered operator
  # procedure whose gate (§9) is not yet passed.
  #
  # The shape is forced by the contracts, not chosen:
  #   C5/C6  the worker binds 127.0.0.1 only and MSP will POST only to an explicit
  #          loopback origin — and a container's 127.0.0.1 is its OWN namespace. So
  #          the worker must share the namespace of whatever spawns the source-side
  #          MSP, which is web. Hence network_mode, and hence no `ports` and no
  #          `networks` (Compose forbids both here, and publishing would be wrong
  #          anyway: this port must be unreachable from the host, zuri-network and ngrok).
  #   C8     the SQLite files are named volumes, never Windows bind mounts.
  #   §7     .env.knowledge is this container's ONLY env file, so web's database,
  #          LINE and model credentials never reach it.
  genesis-worker:
    profiles: ["knowledge"]
    build:
      context: .
      dockerfile: Dockerfile
      target: genesis-worker
      # The three pinned source repositories. deploy/ki17/pins.json names the commits
      # and the build refuses to continue when a context's HEAD is not one of them.
      # Defaults are this device's sibling checkouts, relative to the project directory.
      additional_contexts:
        msp: ${KI17_MSP_CONTEXT:-../../../Memory-and-Soul-Passport}
        gks: ${KI17_GKS_CONTEXT:-../../../Genesis-Knowledge-System}
        genesisblock: ${KI17_GENESISBLOCK_CONTEXT:-../../../GenesisBlock-ki17}
    image: ${ZURI_GENESIS_WORKER_IMAGE:-zuri-ai-genesis-worker:local}
    restart: unless-stopped
    # R-3: every web deploy recreates this container mid-work. The contract requires
    # crash-safe transaction intents and a durable outbox, and 60s lets an in-flight
    # native commit finish rather than be interrupted (same reasoning as web's).
    stop_grace_period: 60s
    network_mode: "service:web"
    env_file:
      - path: .env.knowledge
        required: true
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ki17-state:/var/lib/zuri-ki17/state
      - ki17-genesis-store:/var/lib/zuri-ki17/genesis
      # Read-only, and mounted here only: "one process holds the native store and the
      # model". The worker re-verifies all five files' SHA-256 at start (G-7).
      - ki17-model:/opt/ki17/model:ro
    healthcheck:
      # §10 step 3 — liveness ONLY: a TCP connect, no bearer token and no query. It
      # answers "is the worker listening inside this namespace", which is exactly the
      # R-2 failure (web recreated, worker left in a dead namespace). Whether the relay
      # actually works is the P-5 smoke script's job, not a healthcheck's.
      # The port is read from the container's own environment rather than interpolated:
      # ${GENESIS_WORKER_PORT} here would resolve against .env, and this variable lives
      # in .env.knowledge, which Compose does not interpolate from.
      test: ["CMD", "/opt/ki17/node/bin/node", "-e", "const net=require('node:net');const s=net.connect({host:'127.0.0.1',port:Number(process.env.GENESIS_WORKER_PORT||0)});s.setTimeout(4000);s.on('connect',()=>{s.destroy();process.exit(0)});s.on('timeout',()=>{s.destroy();process.exit(1)});s.on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      # The model is ~490 MB and every file is SHA-256-verified before the worker
      # listens, then durable state is resumed. 40s (web's value) would flap.
      start_period: 180s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  ngrok:
    image: ngrok/ngrok:3
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      # Never hardcoded: comes from .env (gitignored) or the shell.
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    volumes:
      - ./deploy/ngrok/ngrok.yml:/etc/ngrok.yml:ro
    # `web:3000` — the Compose DNS name of the app. `localhost` inside this container
    # would be the ngrok container itself. `--url` is added only when NGROK_DOMAIN is
    # set (a static/assigned domain keeps the public URL stable across restarts);
    # without it ngrok assigns a temporary URL — read it with scripts/ngrok-url.ps1.
    # `--url=https://<domain>`, not the older `--domain=<domain>`: verified 2026-09-04
    # against the pulled ngrok/ngrok:3 image (agent v3.39) — `--domain` still works but
    # logs "Flag --domain has been deprecated, use --url instead".
    # `--host-header=preserve`: by default the agent rewrites Host to the upstream
    # address (`web:3000`). The app builds absolute redirects from request.url
    # (plugin consent, FR-123) and exempts loopback hosts from auth on /api/docs
    # (SEC-006), so the public hostname must reach it unchanged.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - exec ngrok http web:3000 --config /etc/ngrok.yml --host-header=preserve --log stdout --log-format json ${NGROK_DOMAIN:+--url=https://${NGROK_DOMAIN}}
    ports:
      # ngrok's local inspection API/UI — loopback only, never public.
      - "127.0.0.1:${NGROK_INSPECT_PORT:-4040}:4040"
    networks:
      - zuri-network
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Optional bundled Postgres (COMPOSE_PROFILES=local-db). Production-mode zuri-ai
  # refuses SQLite (src/lib/db.js: PRODUCTION_DATABASE_URL_REQUIRED), so a deployment
  # is either this service or an external Postgres such as Supabase. No host port is
  # published: the database is reachable only on the Compose network.
  db:
    image: postgres:16-alpine
    profiles: ["local-db"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zuri}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-zuri}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - zuri-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # One-shot schema push for the bundled Postgres (prisma/schema.postgres.prisma is the
  # generated Postgres twin of prisma/schema.prisma). Runs before `web` when the
  # local-db profile is active, then exits. The same image carries the repo's
  # operator scripts, e.g.
  #   docker compose run --rm --no-deps db-migrate node scripts/bootstrap-operator.mjs --email you@example.com --name "You"
  db-migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: tools
    image: ${ZURI_TOOLS_IMAGE:-zuri-ai-tools:local}
    profiles: ["local-db"]
    restart: "no"
    env_file:
      - path: .env
        required: true
      - path: .env.docker
        required: false
    environment:
      NODE_ENV: production
      ZURI_LINE_DB_CA_FILE: /app/certs/supabase-prod-ca-2021.crt
      ZURI_CUSTOMER_REVIEW_DB_CA_FILE: /app/certs/supabase-prod-ca-2021.crt
    # DIRECT_URL is what the Prisma CLI reads for schema work; it defaults to
    # DATABASE_URL so the bundled database needs one URL, not two.
    command:
      - /bin/sh
      - -c
      - 'export DIRECT_URL="$${DIRECT_URL:-$$DATABASE_URL}"; exec node node_modules/prisma/build/index.js db push --schema prisma/schema.postgres.prisma --skip-generate'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - zuri-network

networks:
  zuri-network:
    driver: bridge

volumes:
  # Durable Postgres data for the local-db profile; survives `docker compose down`
  # (only `down -v` removes it).
  db-data:

  # ADR-075 Phase 3 §6. Named, never Windows bind mounts: a process on the Windows
  # host and a process in a Linux container cannot safely share a SQLite file, and
  # SQLite's own guidance is not to rely on locking across a file-sharing layer.
  # These live on Docker's WSL2 data disk.
  #
  # `down -v` DESTROYS THE PUBLISHED GENERATIONS AND MUST NEVER BE PART OF THIS
  # PROCEDURE (§6, §11). A full reset of MSP and GKS state happens only on the
  # owner's instruction, and by moving the volumes aside — never by deleting them.
  # The 2026-09-06 RCA on deleting resources that were still in use applies here.

  # msp.sqlite + gks.sqlite: the two MSP sides and every GKS child open the same files.
  ki17-state:
  # The GenesisBlock native store, candidate and published snapshots, the publication
  # pointer and the durable outbox. Mounted in genesis-worker ONLY, which is what
  # enforces "exactly one process holds the native store" (C7).
  ki17-genesis-store:
  # intfloat/multilingual-e5-small at the pinned revision, ~490 MB, operator-supplied
  # and mounted read-only. The worker re-verifies its five SHA-256 values at start (G-7).
  ki17-model:
