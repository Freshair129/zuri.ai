name: edge-ci

# Every pull request, and every push to the default branch. This repository had no
# CI at all until now, so a green PR page meant nothing: the type checker and the
# 200+ tests only ever ran on whichever machine the author happened to use.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Named `edge-verify`, not `verify`. GitHub matches a required status check by
  # its context name alone and cannot tell two same-named jobs apart, so while
  # this job and governance.yml's `verify` shared a name, `main`'s branch
  # protection had one required check standing for two different runs — and
  # whichever reported last decided the outcome. Keep these names distinct.
  edge-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/edge
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/edge/package-lock.json

      # `npm ci` rather than `npm install`: the lockfile is the contract, and a CI
      # run that quietly resolves a different tree is not checking what ships.
      - name: Install
        run: npm ci

      # A test file nobody runs makes the suite green while covering less, and
      # silence looks exactly like success. This repository has already had it
      # happen — see the script, which explains what it checks and why the first
      # version of this guard asked the wrong question.
      - name: Every test file is actually run
        run: node scripts/assert-tests-are-run.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The cross-repo harness in zuri.ai imports this package's compiled output, so
      # a build that breaks silently would only surface over there. Checked here.
      - name: Build
        run: npm run build

  desktop:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: apps/edge/package-lock.json
      - name: Build the managed worker
        working-directory: apps/edge
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: 'apps/edge/src-tauri -> target'
      - name: Native pairing and credential tests
        run: cargo test --locked --manifest-path apps/edge/src-tauri/Cargo.toml --lib
      - name: Build Desktop with embedded frontend
        run: cargo build --locked --manifest-path apps/edge/src-tauri/Cargo.toml --release
      - name: Verify portable worker lifecycle against synthetic server
        shell: pwsh
        run: |
          $env:ZURI_DESKTOP_TEST_PACKAGE = Join-Path $env:RUNNER_TEMP 'edge-ci-portable'
          node apps/edge/scripts/package-desktop.mjs $env:ZURI_DESKTOP_TEST_PACKAGE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path apps/edge/src-tauri/Cargo.toml --lib packaged_runtime_tests -- --ignored
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
