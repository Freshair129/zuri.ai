name: governance

# Why this exists: until 2026-08-17 nothing ran the governance commands
# automatically — no CI, no git hooks, no lifecycle hooks. `docs:preflight` and
# `docs:check` were manual, so the "preflight CRITICAL" that CLAUDE.md describes
# as a hard gate only fired when someone chose to run it. Every merge was gated
# by an author's discipline rather than by the repository.
# See .brain/rca/2026-08-17-governance-did-not-govern.md

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    # windows-latest, not ubuntu: `src/modules/project-manager/local-files/`
    # hardcodes `path.win32` in three files, deliberately — mounted-root
    # containment has to reason about drive letters, UNC paths and
    # junction/reparse points (SEC-007). On Linux those helpers turn `/tmp/x`
    # into `\tmp\x` and FR-045's integration tests fail with ENOENT. The first
    # CI run found this; the constraint was real and undocumented, not a
    # regression. See .brain/rca/2026-08-17-ci-found-an-undocumented-platform-constraint.md
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `postinstall` runs `prisma generate`, so the client is built here.
      - run: npm ci

      - name: Unit and integration tests
        run: npm test

      - name: Production build
        run: npm run build

      # docs:graph rebuilds from the filesystem, docs:check fails when the
      # committed graph disagrees with it, docs:preflight (--strict) fails on
      # any CRITICAL. The order matters: two preflight checks read the graph,
      # so a branch that declares a new id must regenerate before preflighting.
      - name: Governance chain
        run: npm run govern

      # The generated human views are deterministic, so if `govern` rewrote one
      # the branch is shipping a stale view and docs:check cannot see it —
      # `--check` compares a canonical projection of the graph, not the views.
      #
      # `.doc-graph.json` is deliberately NOT listed. It carries `generated_at`,
      # a `drift` block and per-node `status` — bookkeeping *about the previous
      # run*, which changes on every regeneration by design. `docs:check` strips
      # exactly those fields before comparing, and demanding byte-stability here
      # instead reintroduced the two-pass convergence bug fixed in #15/#22. The
      # first CI run caught that; keep the narrower list.
      - name: Generated views are committed and current
        shell: bash
        run: |
          if ! git diff --quiet -- docs/FEATURE-MAP.md docs/DOMAIN-MAP.md docs/TRACE.md docs/appendices/D-traceability.md; then
            echo "::error::A generated view is out of date. Run 'npm run govern' and commit the result."
            git --no-pager diff --stat -- docs/FEATURE-MAP.md docs/DOMAIN-MAP.md docs/TRACE.md docs/appendices/D-traceability.md
            exit 1
          fi

  e2e:
    # windows-latest, not ubuntu: `src/modules/project-manager/local-files/`
    # hardcodes `path.win32` in three files, deliberately — mounted-root
    # containment has to reason about drive letters, UNC paths and
    # junction/reparse points (SEC-007). On Linux those helpers turn `/tmp/x`
    # into `\tmp\x` and FR-045's integration tests fail with ENOENT. The first
    # CI run found this; the constraint was real and undocumented, not a
    # regression. See .brain/rca/2026-08-17-ci-found-an-undocumented-platform-constraint.md
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # Kept as its own job so an e2e failure is attributable, and because the
      # full suite is the only thing that catches cross-spec interference — a
      # subset passing proves nothing (.brain/rca/2026-08-16-e2e-subset-green-
      # and-shared-state.md).
      - name: Full end-to-end suite
        run: npm run test:e2e
