name: governance

# Why this exists: until 2026-08-17 nothing ran the governance commands
# automatically — no CI, no git hooks, no lifecycle hooks. `docs:preflight` and
# `docs:check` were manual, so the "preflight CRITICAL" that CLAUDE.md describes
# as a hard gate only fired when someone chose to run it. Every merge was gated
# by an author's discipline rather than by the repository.
# See .brain/rca/2026-08-17-governance-did-not-govern.md

on:
  pull_request:
    # `labeled` so that adding the `ci:full` label (see `changes`) re-runs the
    # checks with the full suite; re-running an old run replays its payload,
    # which does not carry the new label.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  # 02:00 Asia/Bangkok. A full e2e run on `main`, on a clock rather than on a
  # commit. Use workflow_dispatch for an on-demand run after a merge or before
  # a release; pushes to `main` do not start this slow suite automatically.
  #
  # What this does NOT exist for: "specs the selector never picks would never
  # run". Scheduled and manual runs pass `--all`, so every spec is exercised
  # by the full suite even though ordinary merges do not pay its warm-up cost.
  #
  # It exists for the failures that arrive with no commit at all: a Playwright
  # browser build refreshed under a restored cache, a `windows-latest` runner
  # image rolled forward, a transitive dependency republished. Those land
  # between merges and, on a quiet week, would first be seen by whoever opens
  # the next pull request — who would reasonably read it as their own breakage.
  # A dated nightly result says whether `main` was already red.
  #
  # Only `e2e` runs here; `verify` is skipped below, because nothing it checks
  # (tests, build, the governance chain, the freshness gates) can change while
  # the tree does not.
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  # Which parts of the tree changed. The e2e suite takes 7-8 minutes and cannot
  # observe a documentation-only change at all, so a doc slice used to pay the
  # full price for nothing — four of six pull requests on 2026-08-17 were
  # docs-only.
  #
  # The condition is computed from the actual diff, never from a label, a title
  # convention or an author's word, and it FAILS SAFE in every direction:
  # anything outside `docs/` and `.brain/` counts as code, an unreadable diff
  # counts as code, and a missing base sha counts as code. A path nobody
  # anticipated therefore runs the full suite rather than skipping it — the
  # opposite of an allowlist that silently grows holes.
  #
  # `verify` is deliberately NOT gated on this. It carries the governance chain,
  # which is exactly what a documentation change has to pass.
  #
  # `server` (2026-09-27, owner instruction): the reason services are extracted
  # is that a change confined to one is verified by that service alone. When a
  # pull request's whole diff sits inside isolated services
  # (scripts/ci-change-scope.mjs), `server=false`: `tests` and `build` are
  # skipped, `govern` still runs (the doc graph scans services/*/src and test)
  # and also runs `contracts` — the apps/server tests that import that service's
  # code. Every other diff, every push to `main` and every classification
  # failure is `server=true`, the full suite, so `main` stays fully verified.
  #
  # `test_mode` (2026-09-27, owner instruction: "narrow, per FR"): a pull request
  # whose diff is apps/server source/tests (plus docs) runs only the RELATED
  # tests — importers of the changed files by vitest's own module graph, every
  # test naming a requirement id the changed files declare with `@req`, and the
  # changed tests. `scripts/ci-change-scope.mjs --related` decides it and falls
  # back to `full` for prisma, lockfiles, vitest config/setup, tests/helpers and
  # fixtures, .github, scripts, src/lib, env and config
  # files, a deleted source, a fan-out above 40% of the suite, or any failure.
  # Pushes to `main`, the schedule and workflow_dispatch never enter related
  # mode, and the `ci:full` pull request label forces the full suite.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      server: ${{ steps.filter.outputs.server }}
      services: ${{ steps.filter.outputs.services }}
      contracts: ${{ steps.filter.outputs.contracts }}
      test_mode: ${{ steps.related.outputs.test_mode }}
      test_reason: ${{ steps.related.outputs.test_reason }}
      related: ${{ steps.related.outputs.related }}
      postgres: ${{ steps.related.outputs.postgres }}
      test_shards: ${{ steps.related.outputs.test_shards }}
      test_shard_total: ${{ steps.related.outputs.test_shard_total }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - id: filter
        shell: bash
        run: |
          set -uo pipefail
          # A scheduled run has no diff to classify — there is no new commit,
          # which is the whole point of it. It would reach the same answer by
          # accident (`github.event.before` is empty on a schedule, and the
          # no-usable-base case below fails open), but an accident is not a
          # decision: say it here so the log states the reason.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "scheduled run — exercising the full suite against main"
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "server=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base='${{ github.event.pull_request.base.sha }}'
            head='${{ github.event.pull_request.head.sha }}'
          else
            base='${{ github.event.before }}'
            head='${{ github.sha }}'
          fi

          # A first push, a force push or a branch with no common history gives
          # an empty or all-zero base. Nothing can be concluded from that, so
          # conclude nothing and run everything.
          case "$base" in
            ''|0000000000000000000000000000000000000000)
              echo "no usable base ($base) — running the full suite"
              echo "code=true" >> "$GITHUB_OUTPUT"; echo "server=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac

          if ! changed=$(git diff --name-only "$base" "$head" 2>&1); then
            echo "could not diff $base..$head — running the full suite"
            echo "$changed"
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "server=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          echo "changed files:"; echo "$changed"
          printf '%s\n' "$changed" > "$RUNNER_TEMP/changed.txt"

          # Root documentation files are enumerated, never matched by a `*.md`
          # wildcard. A wildcard would also skip a README dropped into `src/`
          # beside code, and the whole point of this filter is that a surprise
          # runs the suite rather than dodges it.
          # Read the whole diff: grep -q can close a large pipe early, and under
          # pipefail that was misclassified as docs-only (PR 264 relocation).
          if ! printf '%s\n' "$changed" | node scripts/ci-code-changes.mjs >> "$GITHUB_OUTPUT"; then
            echo "classification failed — running the full suite"
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

          # A push to `main` always runs the full server suite: it is the
          # safety net behind every scoped pull request.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "not a pull request — full server suite"
            echo "server=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! scope=$(printf '%s\n' "$changed" | node scripts/ci-change-scope.mjs); then
            echo "scope classification failed — full server suite"
            echo "server=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "scope:"; echo "$scope"
          printf '%s\n' "$scope" >> "$GITHUB_OUTPUT"

      # Related mode, pull requests only. The cheap path check runs first, so a
      # diff that must run the full suite never pays for the install below.
      - id: eligible
        if: github.event_name == 'pull_request' && steps.filter.outputs.server == 'true' && !contains(github.event.pull_request.labels.*.name, 'ci:full')
        shell: bash
        run: |
          set -uo pipefail
          if ! verdict=$(node scripts/ci-change-scope.mjs --related-eligible < "$RUNNER_TEMP/changed.txt"); then
            echo "eligibility check failed — full server suite"
            echo "candidate=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "$verdict"
          printf '%s\n' "$verdict" >> "$GITHUB_OUTPUT"

      # vitest only transforms modules to read their imports; nothing executes,
      # so the prisma client that `postinstall` generates is not needed here,
      # and the install is cached whole on the lockfile: a hit skips `npm ci`.
      - name: Restore apps/server node_modules for the module graph
        id: graph-deps
        if: steps.eligible.outputs.candidate == 'true'
        uses: actions/cache/restore@v4
        with:
          path: apps/server/node_modules
          key: ${{ runner.os }}-server-nm-graph-node22-${{ hashFiles('apps/server/package-lock.json') }}

      - uses: actions/setup-node@v4
        if: steps.eligible.outputs.candidate == 'true' && steps.graph-deps.outputs.cache-hit != 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/server/package-lock.json

      - name: Install apps/server for the module graph
        if: steps.eligible.outputs.candidate == 'true' && steps.graph-deps.outputs.cache-hit != 'true'
        working-directory: apps/server
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Save apps/server node_modules for the module graph
        if: steps.eligible.outputs.candidate == 'true' && steps.graph-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: apps/server/node_modules
          key: ${{ steps.graph-deps.outputs.cache-primary-key }}

      - id: related
        if: steps.eligible.outputs.candidate == 'true'
        shell: bash
        run: |
          set -uo pipefail
          if ! out=$(node scripts/ci-change-scope.mjs --related < "$RUNNER_TEMP/changed.txt"); then
            echo "related computation failed — full server suite"
            echo "test_mode=full" >> "$GITHUB_OUTPUT"; exit 0
          fi
          printf '%s\n' "$out"
          printf '%s\n' "$out" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # `verify` used to be one job: install → govern → tests → build, ~14.5 min in
  # sequence, of which the tests were ~11 and the governance chain 22 seconds.
  # Two consequences the owner hit on 2026-09-13 (PR #364): a stale
  # `domain-state.json` and an unreviewed id-ledger digest — both 20-second
  # governance findings — were reported after 13 minutes, and each fix push
  # re-ran the whole 14.5 minutes, because GitHub re-runs a JOB, never a step,
  # and a new commit is a new run in any case.
  #
  # Split (owner instruction, 2026-09-13):
  #   govern  — the governance chain, the committed-state guard, the LLM corpus
  #             and the governance-facing unit tests. Reports in ~2-3 minutes,
  #             so a documentation or annotation slip is red before the suite
  #             is half done.
  #   tests   — the full unit + integration suite, in four shards (2026-09-27).
  #             Skipped, with `build`, for a service-scoped pull request.
  #   build   — the production build, no longer queued behind the tests.
  #   conversation-runtime — isolated service tests, boundary build and image build.
  #   market-intelligence — the ADR-108 service package: isolated tests,
  #             boundary build, Postgres store conformance and image build.
  #   verify  — an aggregate that fails if any of the five did. Branch
  #             protection requires a check literally named `verify`
  #             (`changes`, `verify`, `edge-verify`), and a required check that
  #             only covered one of the three would let a red suite merge.
  #
  # The server's three long checks run in PARALLEL rather than govern-first-then-the-rest: gating the
  # 11-minute suite on a 3-minute job would add 3 minutes to every green run to
  # save runner minutes on the red ones, and time-to-signal — not runner cost —
  # is what this split is for. `gh run rerun --failed` now re-runs only the job
  # that failed when the failure was environmental.
  #
  # windows-latest on all three, not ubuntu: `src/modules/project-manager/local-files/`
  # hardcodes `path.win32` in three files, deliberately — mounted-root
  # containment has to reason about drive letters, UNC paths and junction/reparse
  # points (SEC-007). On Linux those helpers turn `/tmp/x` into `\tmp\x` and
  # FR-045's integration tests fail with ENOENT. The first CI run found this; the
  # constraint was real and undocumented, not a regression. See
  # .brain/rca/2026-08-17-ci-found-an-undocumented-platform-constraint.md
  # The nightly run skips all of them: on a schedule the commit is whatever
  # `main` already merged and verified, so nothing here can change.
  # ---------------------------------------------------------------------------
  govern:
    needs: changes
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/server/package-lock.json

      # `postinstall` runs `prisma generate`, so the client is built here.
      - run: npm ci

      # docs:graph rebuilds from the filesystem, docs:check re-runs the
      # generator and fails when a second pass disagrees with the first, and
      # docs:preflight (--strict) fails on any CRITICAL. The order matters: two
      # preflight checks read the graph, so it must be built before preflighting.
      #
      # The steps that used to sit around this one — "Committed graph is
      # current", "Relocated graph is committed and current" and the
      # generated-views diff — are gone with the committed artefacts they
      # guarded (ADR-081 D3). What is left is the stronger question `docs:check`
      # still asks: is the generator REPRODUCIBLE.
      - name: Governance chain
        run: npm run govern

      # `runtime/domain-state.json` IS still committed — the app imports it and
      # the Docker build context cannot regenerate it (ADR-081 D2) — so it keeps
      # a byte-stability check of its own. #354 removed the run timestamp that
      # made this impossible before.
      - name: Bundled runtime state is committed and current
        working-directory: .
        shell: bash
        run: |
          # FR-212 / ADR-085 D4: the data pipeline map projection is committed for
          # the same reason and guarded the same way.
          for committed in apps/server/runtime/domain-state.json apps/server/runtime/data-pipeline-map.json; do
            if ! git diff --quiet -- "$committed" || [ -n "$(git ls-files --others --exclude-standard -- "$committed")" ]; then
              echo "::error::$committed is out of date. Run 'npm run govern' and commit the result."
              git --no-pager diff --stat -- "$committed"
              exit 1
            fi
          done

      # The unit tests that read the governance inputs the chain above just
      # rebuilt — the id ledger, the doc graph, the domain state, the schema
      # migration set, the design tokens. They are the tests a documentation
      # or annotation change can break, and they run in well under a minute,
      # so a break is red here and not eleven minutes into `tests`. `tests`
      # runs them again as part of the full suite; the duplication is the
      # point, not a cost.
      #
      # Explicit files, not a glob: a glob that matched nothing would make
      # assert-tests-ran fail, which is right, but a glob that matched the
      # wrong thing would quietly move the slow tail here.
      - name: Governance-facing unit tests
        run: >-
          npm test --
          tests/unit/id-anchor-stability.test.js
          tests/unit/domain-state.test.js
          tests/unit/design-system.test.js
          tests/unit/schema-migration-drift.test.js
          tests/unit/doc-graph-canonical-text.test.js
          tests/unit/doc-graph-delivery-attribution.test.js
          tests/unit/doc-graph-retired-rules.test.js

      # A service-scoped pull request skips `tests`, so the apps/server tests
      # that import the changed service's code — the Core-side contract tests —
      # run here instead. The list is computed from the tree by
      # scripts/ci-change-scope.mjs, not maintained by hand. On a full run
      # `tests` covers them and this step is skipped.
      - name: Service contract tests (service-scoped pull request)
        if: needs.changes.outputs.server == 'false' && needs.changes.outputs.contracts != ''
        shell: bash
        env:
          CONTRACT_TESTS: ${{ needs.changes.outputs.contracts }}
        run: npm test -- $CONTRACT_TESTS

      # The same WorkToolPort suite on PostgreSQL (vitest.postgres.config.js):
      # a disposable embedded PostgreSQL 17 started and deleted by the run, never
      # a shared database. Here only when the scoped contract tests include it;
      # on a full run the `tests` job runs it.
      - name: WorkToolPort on PostgreSQL (service-scoped pull request)
        if: needs.changes.outputs.server == 'false' && contains(needs.changes.outputs.contracts, 'conversation-runtime-work-tool-port.test.js')
        run: npm run test:postgres

      # llms-full.txt is built, not compared (ADR-081 D1 as amended): with no
      # committed copy there is nothing to be current against, so what is left
      # is whether the generator RUNS. The corpus is uploaded so an LLM reader
      # without a checkout gets a build of it rather than a stale file.
      - name: Build the LLM corpus
        working-directory: .
        shell: bash
        run: node scripts/build-llms-full.mjs

      - name: Keep the LLM corpus
        uses: actions/upload-artifact@v4
        with:
          name: llms-full
          path: llms-full.txt
          retention-days: 30

  # Sharded (2026-09-27): vitest.config.js runs files serially
  # (fileParallelism: false, one SQLite writer), so one job took ~18-20 minutes.
  # Four shards on four runners, each with its own disposable database, divide
  # that wall time. `verify` reads the matrix as one result: success only when
  # every shard succeeded. Skipped for a service-scoped pull request (`changes`).
  #
  # Related mode (`changes` emitted test_mode=related; pull requests only): the
  # same job runs only the computed list through vitest.related.config.js, in
  # 1-4 shards sized by the list (45 files per shard, scripts/ci-change-scope.mjs),
  # and the PostgreSQL step only when the change reaches the WorkToolPort paths.
  tests:
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.server != 'false'
    name: ${{ needs.changes.outputs.test_mode == 'related' && format('tests (related {0}/{1})', matrix.shard, needs.changes.outputs.test_shard_total) || format('tests ({0}/4)', matrix.shard) }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.test_mode == 'related' && needs.changes.outputs.test_shards || '[1, 2, 3, 4]') }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4

      # Setup used to be ~1.5-2.7 min of every shard (PR #609's first run): two
      # setup-node restores of the npm download cache, then two `npm ci`. Both
      # node_modules trees are now cached whole, keyed on everything the install
      # and its postinstall read (lockfile; for the server also the prisma
      # schema and the two client generators), and saved right after a fresh
      # install — before the tests run, so no test output enters the cache. A
      # hit skips the Node 24 toolchain and both installs. A changed input is a
      # new key and a cold install, never a stale tree.
      #
      # Server contract tests exercise the actual Edge runtime schema.
      - name: Restore Edge contract consumer node_modules
        id: edge-deps
        uses: actions/cache/restore@v4
        with:
          path: apps/edge/node_modules
          key: ${{ runner.os }}-edge-nm-node24-${{ hashFiles('apps/edge/package-lock.json') }}
      - uses: actions/setup-node@v4
        if: steps.edge-deps.outputs.cache-hit != 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/edge/package-lock.json
      - name: Install Edge contract consumer
        if: steps.edge-deps.outputs.cache-hit != 'true'
        working-directory: apps/edge
        run: npm ci --no-audit --no-fund
      - name: Save Edge contract consumer node_modules
        if: steps.edge-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: apps/edge/node_modules
          key: ${{ steps.edge-deps.outputs.cache-primary-key }}

      - name: Restore apps/server node_modules
        id: server-deps
        uses: actions/cache/restore@v4
        with:
          path: apps/server/node_modules
          key: ${{ runner.os }}-server-nm-node22-${{ hashFiles('apps/server/package-lock.json', 'apps/server/prisma/schema.prisma', 'apps/server/scripts/generate-prisma-clients.mjs', 'apps/server/scripts/gen-postgres-schema.mjs') }}

      # No npm download cache on a hit: nothing will be downloaded.
      - uses: actions/setup-node@v4
        if: steps.server-deps.outputs.cache-hit == 'true'
        with:
          node-version: '22'
      - uses: actions/setup-node@v4
        if: steps.server-deps.outputs.cache-hit != 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/server/package-lock.json

      # `postinstall` runs `prisma generate`, so the client is in the cached tree.
      - run: npm ci --no-audit --no-fund
        if: steps.server-deps.outputs.cache-hit != 'true'
      - name: Save apps/server node_modules
        if: steps.server-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: apps/server/node_modules
          key: ${{ steps.server-deps.outputs.cache-primary-key }}

      # Several tests read `docs/.doc-graph.json`, which is generated and not
      # committed (ADR-081); in the single-job layout the governance chain had
      # built it a step earlier. The graph alone takes seconds; the checks that
      # judge it belong to `govern`, not here.
      - name: Build the doc graph the tests read
        run: npm run docs:graph

      - name: Unit and integration tests
        if: needs.changes.outputs.test_mode != 'related'
        run: npm test -- --shard=${{ matrix.shard }}/4

      - name: Related unit and integration tests (pull request)
        if: needs.changes.outputs.test_mode == 'related'
        shell: bash
        env:
          RELATED_TESTS: ${{ needs.changes.outputs.related }}
          TEST_REASON: ${{ needs.changes.outputs.test_reason }}
        run: |
          set -euo pipefail
          echo "related mode: $TEST_REASON"
          list="$RUNNER_TEMP/related-tests.txt"
          printf '%s\n' $RELATED_TESTS > "$list"
          test -s "$list"
          ZURI_RELATED_TESTS_FILE="$list" npm test -- --config vitest.related.config.js --shard=${{ matrix.shard }}/${{ needs.changes.outputs.test_shard_total }}

      # The WorkToolPort suite again on PostgreSQL, the production engine
      # (vitest.postgres.config.js): a disposable embedded PostgreSQL 17 on
      # 127.0.0.1, started and deleted by the run; it reads no database URL, so it
      # can never reach a shared database. Once per run, on the first shard.
      - name: WorkToolPort on PostgreSQL
        if: matrix.shard == 1 && (needs.changes.outputs.test_mode != 'related' || needs.changes.outputs.postgres == 'true')
        run: npm run test:postgres

  build:
    needs: changes
    if: github.event_name != 'schedule' && needs.changes.outputs.server != 'false'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/server/package-lock.json

      - run: npm ci

      - name: Production build
        run: npm run build

  conversation-runtime:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/conversation-runtime/package-lock.json

      - name: Install isolated service package
        run: npm ci --prefix services/conversation-runtime

      - name: Conversation Runtime tests
        run: npm --prefix services/conversation-runtime test

      - name: Conversation Runtime build and boundary scan
        run: npm --prefix services/conversation-runtime run build

      - name: Verify resolved Compose build paths
        run: node services/conversation-runtime/scripts/verify-compose-paths.mjs

      - name: Create disposable Compose interpolation file
        shell: bash
        run: touch apps/server/.env

      - name: Verify Docker Compose resolved build paths
        run: node services/conversation-runtime/scripts/verify-compose-paths.mjs --compose
        env:
          CONVERSATION_RUNTIME_TOKEN: ci-only-conversation-runtime-token-not-a-secret-000000
          ZURI_CONVERSATION_RUNTIME_IMAGE: zuri-conversation-runtime:ci

      - name: Build standalone service image through the deployment Compose overlay
        run: docker compose --project-directory apps/server -f apps/server/docker-compose.yml -f apps/server/docker-compose.conversation-runtime.yml build conversation-runtime
        env:
          CONVERSATION_RUNTIME_TOKEN: ci-only-conversation-runtime-token-not-a-secret-000000
          ZURI_CONVERSATION_RUNTIME_IMAGE: zuri-conversation-runtime:ci

      - name: Record hosted image build
        run: echo "HOSTED_IMAGE_BUILD=PASS image=zuri-conversation-runtime:ci"

      - name: Drain and stop the image in a disposable project
        shell: bash
        run: |
          set -euo pipefail
          project="conversation-runtime-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          compose=(docker compose --project-name "$project" -f services/conversation-runtime/docker-compose.smoke.yml)
          cleanup() { "${compose[@]}" down --remove-orphans >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          "${compose[@]}" up -d --build
          container="$("${compose[@]}" ps -q conversation-runtime)"
          test -n "$container"
          mapping="$("${compose[@]}" port conversation-runtime 3081)"
          port="${mapping##*:}"
          for attempt in $(seq 1 30); do
            live="$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:${port}/healthz" || true)"
            if [ "$live" = "200" ]; then break; fi
            sleep 1
          done
          test "$live" = "200"
          ready="$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:${port}/readyz" || true)"
          test "$ready" = "200"
          for attempt in $(seq 1 15); do
            health="$(docker inspect --format '{{.State.Health.Status}}' "$container")"
            if [ "$health" = "healthy" ]; then break; fi
            sleep 1
          done
          test "$health" = "healthy"
          smoke_core_state() {
            "${compose[@]}" exec -T smoke-core node -e "fetch('http://127.0.0.1:4010/test/state').then(r=>r.json()).then(v=>process.stdout.write(JSON.stringify(v))).catch(()=>process.exit(1))"
          }
          for attempt in $(seq 1 30); do
            state="$(smoke_core_state || true)"
            if [[ "$state" == *'"prepareEntered":true'* ]]; then break; fi
            sleep 1
          done
          test -n "$state"
          [[ "$state" == *'"prepareEntered":true'* ]]
          docker stop --time 10 "$container" >/dev/null 2>&1 &
          stop_pid=$!
          ready_during_drain="200"
          for attempt in $(seq 1 30); do
            ready_during_drain="$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:${port}/readyz" || true)"
            if [ "$ready_during_drain" = "503" ]; then break; fi
            sleep 0.2
          done
          test "$ready_during_drain" = "503"
          "${compose[@]}" exec -T smoke-core node -e "fetch('http://127.0.0.1:4010/test/release',{method:'POST'}).then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"
          wait "$stop_pid"
          state="$(docker inspect --format '{{.State.Status}}' "$container")"
          exit_code="$(docker inspect --format '{{.State.ExitCode}}' "$container")"
          test "$state" = "exited"
          test "$exit_code" = "0"
          state="$(smoke_core_state)"
          node -e 'const state=JSON.parse(process.argv[1]); const ok=state.prepareEntered && state.claimCalls===1 && state.providerCalls===1 && state.completeCalls===1 && state.sendCalls===1 && state.traceKinds.includes("MODEL_STARTED") && state.traceKinds.includes("MODEL_COMPLETED"); if (!ok) { process.stderr.write(JSON.stringify(state)+"\\n"); process.exit(1) }' "$state"
          echo "IMAGE_START_SMOKE=PASS healthz=$live readyz_before_drain=$ready readyz_during_drain=$ready_during_drain container_health=$health providerCalls=1 completeCalls=1 sendCalls=1 shutdown_exit=$exit_code project=$project"
        env:
          CR_SMOKE_IMAGE: zuri-conversation-runtime:ci
          CR_SMOKE_CORE_IMAGE: zuri-conversation-runtime-core:ci
          CR_SMOKE_PORT: '0'
          CR_SMOKE_BIND: 127.0.0.1
          CR_SMOKE_TOKEN: ci-only-conversation-runtime-token-not-a-secret-000000

  market-intelligence:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/market-intelligence/package-lock.json

      - name: Install isolated service package
        run: npm ci --prefix services/market-intelligence

      - name: Market Intelligence tests
        run: npm --prefix services/market-intelligence test

      - name: Market Intelligence build and boundary scan
        run: npm --prefix services/market-intelligence run build

      # Disposable postgres:16 container; the script refuses anything it did not start.
      - name: Postgres store conformance
        run: npm --prefix services/market-intelligence run test:pg

      - name: Build standalone service image
        run: docker build -f services/market-intelligence/Dockerfile -t zuri-market-intelligence:ci .

  # The required aggregate check. `if: always()` makes dependency failures
  # visible in one explicit result instead of leaving the aggregate ambiguous.
  verify:
    if: always() && github.event_name != 'schedule'
    needs: [changes, govern, tests, build, conversation-runtime, market-intelligence]
    runs-on: ubuntu-latest
    steps:
      # `tests` and `build` may be skipped ONLY when `changes` succeeded and
      # classified the pull request as service-scoped (server=false). Any other
      # skip — a failed or cancelled `changes`, a missing output — fails here.
      - name: All verification jobs passed
        shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          SERVER: ${{ needs.changes.outputs.server }}
          SERVICES: ${{ needs.changes.outputs.services }}
          EVENT: ${{ github.event_name }}
          TEST_MODE: ${{ needs.changes.outputs.test_mode }}
          TEST_REASON: ${{ needs.changes.outputs.test_reason }}
          RELATED: ${{ needs.changes.outputs.related }}
          GOVERN: ${{ needs.govern.result }}
          TESTS: ${{ needs.tests.result }}
          BUILD: ${{ needs.build.result }}
          CONVERSATION_RUNTIME: ${{ needs.conversation-runtime.result }}
          MARKET_INTELLIGENCE: ${{ needs.market-intelligence.result }}
        run: |
          echo "changes: $CHANGES (server=$SERVER services=$SERVICES)"
          echo "test mode: ${TEST_MODE:-full} $TEST_REASON"
          echo "govern: $GOVERN"
          echo "tests:  $TESTS"
          echo "build:  $BUILD"
          echo "conversation-runtime: $CONVERSATION_RUNTIME"
          echo "market-intelligence: $MARKET_INTELLIGENCE"
          fail() { echo "::error::$1"; exit 1; }
          [ "$CHANGES" = "success" ] || fail "changes did not succeed"
          # A narrowed `tests` counts only when `changes` itself emitted related
          # mode, for a pull request, with a non-empty list. `main` is always full.
          case "$TEST_MODE" in
            ''|full) ;;
            related)
              [ "$EVENT" = "pull_request" ] || fail "related test mode outside a pull request"
              [ -n "$RELATED" ] || fail "related test mode with an empty test list" ;;
            *) fail "unknown test mode: $TEST_MODE" ;;
          esac
          for r in "$GOVERN" "$CONVERSATION_RUNTIME" "$MARKET_INTELLIGENCE"; do
            [ "$r" = "success" ] || fail "a verification job did not succeed (see the job results above)"
          done
          for r in "$TESTS" "$BUILD"; do
            if [ "$r" = "success" ]; then continue; fi
            if [ "$r" = "skipped" ] && [ "$SERVER" = "false" ]; then continue; fi
            fail "tests/build did not succeed and the change was not service-scoped"
          done

  e2e:
    # Eligible only on the nightly schedule or an explicit workflow_dispatch;
    # both triggers force the full suite. `changes` remains a dependency so the
    # run has one visible classification path and records why it ran.
    needs: changes
    # Not on pull requests or pushes to `main`, by decision (2026-09-21).
    #
    # e2e has never been a required check — branch protection asks for
    # `changes`, `verify` and `edge-verify` — so on a pull request it could
    # only ever inform, never gate. What it actually did was take 24 and 41
    # minutes on two concurrent PRs, long enough that both were cancelled by
    # hand before finishing. A check nobody waits for is not a check.
    #
    # Making it *targeted* does not rescue it either, and the numbers say why:
    # the warm-up alone measured 918s on windows-latest (recorded in
    # tests/e2e/warmup.setup.js), so even a run of three specs cannot finish
    # much under twenty minutes. The cost is the environment, not the specs.
    #
    # So the suite moves to where a slow honest answer is still useful: the
    # nightly schedule above and an explicit workflow_dispatch. It no longer
    # runs on every push to `main`; it removes that post-merge workload while
    # required PR gates already exclude E2E. Detection is deliberately delayed
    # until the nightly or manual run.
    #
    # Consequence worth stating: with PRs and main pushes excluded, both
    # remaining triggers force the full suite, so the selective mapping in
    # `scripts/ci-select-e2e.mjs` no longer narrows anything in CI. It stays
    # because `npm run test:e2e:changed` — the local loop this was really
    # costing — is now its main consumer.
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.code == 'true'
    # windows-latest, not ubuntu: `src/modules/project-manager/local-files/`
    # hardcodes `path.win32` in three files, deliberately — mounted-root
    # containment has to reason about drive letters, UNC paths and
    # junction/reparse points (SEC-007). On Linux those helpers turn `/tmp/x`
    # into `\tmp\x` and FR-045's integration tests fail with ENOENT. The first
    # CI run found this; the constraint was real and undocumented, not a
    # regression. See .brain/rca/2026-08-17-ci-found-an-undocumented-platform-constraint.md
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/server/package-lock.json

      - run: npm ci

      - name: Cache Playwright browser binaries
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('apps/server/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Select impacted e2e specs
        id: select-e2e
        shell: bash
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            changed=$(git diff --name-only "$base" HEAD)
          else
            changed=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)
          fi
          # `--all` on scheduled and manual runs, stated rather than inferred.
          # The selector must not decide full-vs-targeted coverage from the
          # branch ref: manual runs may be launched from another ref, and a
          # future ref-handling change must not narrow this full run quietly.
          select_args=''
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then select_args='--all'; fi
          echo "Determining impacted e2e targets from changed files..."
          printf '%s\n' "$changed" | node scripts/ci-select-e2e.mjs $select_args >> "$GITHUB_OUTPUT"

      # The e2e server is production-built so route compilation cannot consume
      # a spec's test budget. The dev-only warm-up remains the local default;
      # CI does not need it once `next start` has a complete build. The build
      # is skipped when the selector has no impacted specs.
      - name: Production build for e2e server
        if: steps.select-e2e.outputs.skip != 'true'
        run: npm run build

      - name: Prepare production e2e database
        if: steps.select-e2e.outputs.skip != 'true'
        env:
          E2E_PORT: '3100'
          ZURI_E2E_AUTH_PASSWORD: e2e-ci-owner-password
          ZURI_E2E_SESSION_SECRET: e2e-ci-session-secret-0123456789abcdef
          NODE_ENV: test
          DATABASE_URL: file:./e2e-3100.db
          ZURI_SESSION_SECRET: e2e-ci-session-secret-0123456789abcdef
          ZURI_SEED_OWNER_PASSWORD: e2e-ci-owner-password
        run: node -e "require('./tests/e2e/global-setup.js')()"

      # Playwright's Windows webServer teardown can wait indefinitely when it
      # force-kills a Next process after a real request. Start the built server
      # outside Playwright so the test runner reuses it and this job owns the
      # explicit process cleanup instead.
      - name: Start production e2e server
        if: steps.select-e2e.outputs.skip != 'true'
        shell: pwsh
        env:
          E2E_PORT: '3100'
          E2E_EXTERNAL_SERVER: 'true'
          ZURI_E2E_AUTH_PASSWORD: e2e-ci-owner-password
          ZURI_E2E_SESSION_SECRET: e2e-ci-session-secret-0123456789abcdef
        run: |
          $ErrorActionPreference = 'Stop'
          $port = [int]$env:E2E_PORT
          $env:NODE_ENV = 'test'
          $env:DATABASE_URL = "file:./e2e-$port.db"
          $env:PUBLIC_BASE_URL = "http://localhost:$port"
          $env:ZURI_SESSION_SECRET = $env:ZURI_E2E_SESSION_SECRET
          $env:ZURI_SEED_OWNER_PASSWORD = $env:ZURI_E2E_AUTH_PASSWORD
          $env:ZURI_PLUGIN_CLIENT_ID = 'zuri-plugin-e2e'
          $env:ZURI_PLUGIN_CLIENT_NAME = 'Zuri E2E Harness'
          $env:ZURI_PLUGIN_REDIRECT_URIS = "http://localhost:$port/plugin/e2e-callback"
          $server = Start-Process -FilePath 'node' -ArgumentList @('node_modules/next/dist/bin/next', 'start', '-p', "$port") -WorkingDirectory (Get-Location).Path -WindowStyle Hidden -PassThru
          "E2E_SERVER_PID=$($server.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $deadline = (Get-Date).AddSeconds(120)
          while ($true) {
            if ($server.HasExited) {
              throw "Production e2e server exited before readiness (code $($server.ExitCode))."
            }
            try {
              $response = Invoke-WebRequest -Uri "http://localhost:$port/overview" -UseBasicParsing -TimeoutSec 5
              if ($response.StatusCode -ge 200 -and $response.StatusCode -lt 500) { break }
            } catch { }
            if ((Get-Date) -gt $deadline) {
              taskkill /PID $server.Id /T /F 2>$null
              throw "Timed out waiting for production e2e server on port $port."
            }
            Start-Sleep -Milliseconds 250
          }
          Write-Output "Production e2e server ready on port $port (pid $($server.Id))."

      - name: Run targeted end-to-end tests
        if: steps.select-e2e.outputs.skip != 'true'
        shell: bash
        run: |
          if [ "${{ steps.select-e2e.outputs.run_all }}" = "true" ] || [ -z "${{ steps.select-e2e.outputs.specs }}" ]; then
            echo "Running full end-to-end suite"
            npm run test:e2e
          else
            echo "Running targeted e2e suite (${{ steps.select-e2e.outputs.reason }}):"
            echo "${{ steps.select-e2e.outputs.specs }}"
            npm run test:e2e -- ${{ steps.select-e2e.outputs.specs }}
          fi
        env:
          E2E_SERVER_MODE: production
          E2E_PORT: '3100'
          E2E_EXTERNAL_SERVER: 'true'
          ZURI_E2E_AUTH_PASSWORD: e2e-ci-owner-password
          ZURI_E2E_SESSION_SECRET: e2e-ci-session-secret-0123456789abcdef
          NODE_ENV: test
          DATABASE_URL: file:./e2e-3100.db
          PUBLIC_BASE_URL: http://localhost:3100
          ZURI_SESSION_SECRET: e2e-ci-session-secret-0123456789abcdef
          ZURI_SEED_OWNER_PASSWORD: e2e-ci-owner-password
          # Every expect/pw:api step's duration, so the `expect` budget in
          # playwright.config.js can be set from a measurement rather than
          # from the last failure. See tests/e2e/step-timings-reporter.js.
          E2E_STEP_TIMINGS: node_modules/.cache/zuri-test-proof/e2e-step-timings.json

      - name: Stop production e2e server
        if: always() && steps.select-e2e.outputs.skip != 'true'
        shell: pwsh
        run: |
          if ($env:E2E_SERVER_PID) {
            $server = Get-Process -Id ([int]$env:E2E_SERVER_PID) -ErrorAction SilentlyContinue
            if ($server) {
              taskkill /PID $server.Id /T /F
            }
          }

      - name: e2e skipped (no impacted UI/domain targets)
        if: steps.select-e2e.outputs.skip == 'true'
        shell: bash
        run: echo "Skipped e2e suite (${{ steps.select-e2e.outputs.reason }})"

      - name: Keep the step timings, pass or fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-step-timings
          path: apps/server/node_modules/.cache/zuri-test-proof/e2e-step-timings.json
          if-no-files-found: ignore
          retention-days: 14

      # Playwright already writes a screenshot — and a trace on retry — for every
      # failure, and until now every one of them was deleted with the runner. A
      # suite that fails only on CI is then unreadable from here: the timings say
      # which step ran long, never what the page was showing. Uploaded on failure
      # only, so a green run costs nothing.
      - name: Keep the failure screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-evidence
          path: apps/server/test-results/
          if-no-files-found: ignore
          retention-days: 14
