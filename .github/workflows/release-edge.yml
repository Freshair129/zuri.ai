name: release-edge-desktop

on:
  push:
    tags:
      - 'v*'
      - 'edge-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.2.0)'
        required: true
        default: 'v0.2.0'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/edge/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'apps/edge/src-tauri -> target'

      - name: Install Edge Dependencies
        working-directory: apps/edge
        run: npm ci

      - name: Build Edge Desktop Release Binary
        working-directory: apps/edge
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --release

      - name: Package Windows Artifacts
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          if (-not $ver -or $ver -like "*/*") { $ver = "${{ github.event.inputs.version }}" }
          if (-not $ver) { $ver = "v0.2.0" }
          
          New-Item -ItemType Directory -Force -Path "dist-release"
          Copy-Item "apps/edge/src-tauri/target/release/zuri-edge-device.exe" "dist-release/zuri-edge-device-$ver-windows-x64.exe"
          
          # Generate checksum
          Get-FileHash "dist-release/zuri-edge-device-$ver-windows-x64.exe" -Algorithm SHA256 | Out-File "dist-release/SHA256SUMS.txt"

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.version }}
          name: "Zuri Edge Device ${{ github.ref_name || github.event.inputs.version }}"
          body: |
            ## Zuri Edge Device Desktop Runtime & Zero-Trust Pair Manager
            
            ### 📦 Downloads & Installation:
            - **Windows Standalone Executable (.exe)**: `zuri-edge-device-${{ github.ref_name || github.event.inputs.version }}-windows-x64.exe`
            
            ### 🚀 Features in this release:
            - **Native Rust + Tauri v2 Core Engine**
            - **1-Click Drag & Drop Pairing** with `zuri-edge-pairing-*.json`
            - **Headless Subscription Coordinator** (`codex` / `claude` CLI)
            - **Local LLM via Ollama** (`:11434`)
            - **40-second Zero-Trust Heartbeat Telemetry**
            - **Auto-Update Support** from GitHub Releases
          files: |
            dist-release/*
          draft: false
          prerelease: false
