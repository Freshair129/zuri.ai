name: release-edge-desktop

on:
  push:
    tags:
      - 'edge-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Desktop tag matching its version (e.g. edge-v0.3.0)'
        required: true
        default: 'edge-v0.3.0'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      ZURI_DESKTOP_SERVER_URL: ${{ vars.ZURI_DESKTOP_SERVER_URL }}
      DESKTOP_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: apps/edge/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'apps/edge/src-tauri -> target'

      - name: Install Edge Dependencies
        working-directory: apps/edge
        run: npm ci

      - name: Build Edge Desktop Release Binary
        working-directory: apps/edge
        run: |
          $origin = $env:ZURI_DESKTOP_SERVER_URL
          if (-not $origin) { throw 'Set ZURI_DESKTOP_SERVER_URL to the deployed Zuri HTTPS origin before releasing.' }
          $uri = [Uri]$origin
          if ($uri.Scheme -ne 'https' -or $uri.UserInfo -or $uri.AbsolutePath -ne '/' -or $uri.Query -or $uri.Fragment) { throw 'ZURI_DESKTOP_SERVER_URL must be an HTTPS origin.' }
          $desktopVersion = (Get-Content -LiteralPath src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:DESKTOP_RELEASE_TAG -ne "edge-v$desktopVersion") { throw 'Release tag must match Desktop version.' }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --manifest-path src-tauri/Cargo.toml --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Windows Artifacts
        shell: pwsh
        run: |
          $desktopTag = $env:DESKTOP_RELEASE_TAG
          if ($desktopTag -notmatch '^edge-v\d+\.\d+\.\d+$') { throw 'Invalid Desktop release tag' }
          $desktopPackage = Join-Path $env:RUNNER_TEMP "zuri-$desktopTag"
          node apps/edge/scripts/package-desktop.mjs $desktopPackage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:ZURI_DESKTOP_TEST_PACKAGE = $desktopPackage
          cargo test --locked --manifest-path apps/edge/src-tauri/Cargo.toml --lib packaged_runtime_tests -- --ignored
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path "dist-release" | Out-Null
          $desktopZip = Join-Path (Get-Location) "dist-release/zuri-edge-device-$desktopTag-windows-x64.zip"
          Compress-Archive -LiteralPath $desktopPackage -DestinationPath $desktopZip
          $desktopHash = (Get-FileHash -LiteralPath $desktopZip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$desktopHash  $([IO.Path]::GetFileName($desktopZip))" | Set-Content -LiteralPath "dist-release/SHA256SUMS.txt"

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ env.DESKTOP_RELEASE_TAG }}
          name: "Zuri Edge Device ${{ env.DESKTOP_RELEASE_TAG }}"
          body: |
            ## Zuri Edge Device Desktop Runtime & Zero-Trust Pair Manager
            
            ### 📦 Downloads & Installation:
            - **Windows portable ZIP**: extract the entire package and open `zuri-edge-device.exe`.
            
            ### 🚀 Features in this release:
            - **Native Rust + Tauri v2 Core Engine**
            - **Browser or QR pairing** with an authenticated Business owner
            - **One-use, five-minute approval requests**; no manual key copy
            - **Windows DPAPI-protected device credential**
            - Separate Ollama, Codex and Claude model settings and provider login controls
            - Managed compute worker with explicit Start/Stop and observed heartbeat status
            - Pinned Node runtime and checksum manifest for worker resources
            - Advanced compatibility import for existing pairing JSON files
            - Requires the matching browser-pairing routes on the configured Server.
            - Requires separately installed Ollama/models or Codex/Claude CLI and local RAG service.
            - Provider login and production device activation require user completion.
            - Pairing does not start the worker; this package never starts the legacy LINE webhook.
          files: |
            dist-release/*
          draft: false
          prerelease: false
