name: PR841 runtime projection receipt (temporary)

# Temporary regeneration transport for the reviewed candidate. Remove this file
# before merge. It neither changes nor replaces any required verification job.
on:
  pull_request:
    paths:
      - '.github/workflows/pr841-runtime-projection-receipt.yml'

permissions:
  contents: read

jobs:
  generate:
    if: github.repository == 'Freshair129/zuri.ai' && github.event.pull_request.number == 841 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Do not run mutable PR code with the blob-publication credential.
          ref: bb24420deb9b3e8468261268bb69f0cfe806046f
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/server/package-lock.json
      - name: Install generator dependencies
        working-directory: apps/server
        run: npm ci --no-audit --no-fund
      - name: Regenerate from the pinned source
        working-directory: apps/server
        run: npm run docs:graph
      - name: Check generator reproducibility
        working-directory: apps/server
        run: npm run docs:check
      - name: Publish generated blobs only, never branch refs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $source = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $source -ne 'bb24420deb9b3e8468261268bb69f0cfe806046f') { throw 'Pinned source mismatch' }
          $receipt = @()
          foreach ($name in @('domain-state', 'data-pipeline-map')) {
            $file = "apps/server/runtime/$name.json"
            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $file).Path)
            $payload = Join-Path $env:RUNNER_TEMP "$name-blob-request.json"
            [System.IO.File]::WriteAllText($payload, (@{ encoding = 'base64'; content = [Convert]::ToBase64String($bytes) } | ConvertTo-Json -Compress))
            $blob = gh api --method POST "repos/$env:GH_REPO/git/blobs" --input $payload --jq '.sha'
            if ($LASTEXITCODE -ne 0 -or $blob -notmatch '^[0-9a-f]{40}$') { throw 'Blob publication failed' }
            $localBlob = git hash-object -- $file
            if ($LASTEXITCODE -ne 0 -or $localBlob -ne $blob) { throw 'Published blob differs from generator output' }
            $receipt += @{ path = $file; blob = $blob; sha256 = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant(); bytes = $bytes.Length }
            Write-Output "$file blob=$blob"
          }
          @{ sourceCommit = $source; workflowRun = $env:GITHUB_RUN_ID; node = (node --version); files = $receipt } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 apps/server/runtime/pr841-generation-receipt.json
      - name: Retain exact generated output and receipt
        uses: actions/upload-artifact@v4
        with:
          name: pr841-runtime-generated-bb24420
          path: |
            apps/server/runtime/domain-state.json
            apps/server/runtime/data-pipeline-map.json
            apps/server/runtime/pr841-generation-receipt.json
          if-no-files-found: error
          retention-days: 1
