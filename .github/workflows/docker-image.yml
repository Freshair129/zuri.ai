name: docker-image

# Builds the production image defined by Dockerfile (ADR-058).
# ADR-062 containment: every event builds only until private publication and
# consumer access are verified. Existing images and local runtime stay in place.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - apps/server/**
      - .github/workflows/docker-image.yml
  pull_request:
    paths:
      - apps/server/Dockerfile
      - apps/server/.dockerignore
      - apps/server/docker-compose.yml
      - apps/server/deploy/**
      - apps/server/next.config.js
      - apps/server/package.json
      - apps/server/package-lock.json
      - .github/workflows/docker-image.yml
  workflow_dispatch:
    inputs:
      compact_prepare_input:
        description: Build a source-bound disposable TEST core input (no publish/deploy)
        type: boolean
        default: false
      compact_package:
        description: Package explicit prepared Compact inputs (no publish/deploy)
        type: boolean
        default: false
      compact_qualify_core:
        description: Run owned disposable core/recovery tests on the packaged OCI candidate
        type: boolean
        default: false
      compact_input_run_id:
        description: Same-repository workflow run containing prepared inputs
        type: string
        default: ''
      compact_input_artifact_id:
        description: Immutable artifact ID containing release-manifest.json and payloads
        type: string
        default: ''

# Build at most one image candidate for the latest main snapshot. Each version
# tag and manually dispatched build remains independent.
concurrency:
  group: docker-image-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main') || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

permissions:
  contents: read

jobs:
  compact-prepare:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.compact_prepare_input }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/server
    env:
      COMPACT_TEST_DOCKER_CONTEXT: compact-prepare-ci
    steps:
      - uses: actions/checkout@v4
        with:
          # Canonical registry governance verifies pinned historical source trees.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/server/package-lock.json
      - run: npm ci
      - run: npm run compact:test
      - name: Build and check current canonical graph
        run: npm run govern
      - uses: docker/setup-docker-action@v5
        with:
          context: compact-prepare-ci
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - uses: docker/setup-buildx-action@v3
        with:
          name: compact-prepare-builder
          endpoint: compact-prepare-ci
      - name: Export exact-source core images
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/compact-source" "$RUNNER_TEMP/compact-exports"
          git -C ../.. archive "$GITHUB_SHA" apps/server | tar -x -C "$RUNNER_TEMP/compact-source"
          source="$RUNNER_TEMP/compact-source/apps/server"
          for pair in web:runner tools:tools; do
            component="${pair%%:*}"; target="${pair#*:}"
            docker --context "$COMPACT_TEST_DOCKER_CONTEXT" buildx build --builder compact-prepare-builder \
              --platform linux/amd64 --provenance=false --sbom=false --target "$target" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --output "type=oci,tar=false,dest=$RUNNER_TEMP/compact-exports/$component" "$source"
          done
          docker --context "$COMPACT_TEST_DOCKER_CONTEXT" buildx build --builder compact-prepare-builder \
            --platform linux/amd64 --provenance=false --sbom=false \
            --file "$source/deploy/compact/Minio.test.Dockerfile" \
            --output "type=oci,tar=false,dest=$RUNNER_TEMP/compact-exports/storage" "$source"
          printf '%s\n' 'FROM postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea' > "$RUNNER_TEMP/Postgres.test.Dockerfile"
          docker --context "$COMPACT_TEST_DOCKER_CONTEXT" buildx build --builder compact-prepare-builder \
            --platform linux/amd64 --provenance=false --sbom=false \
            --file "$RUNNER_TEMP/Postgres.test.Dockerfile" \
            --output "type=oci,tar=false,dest=$RUNNER_TEMP/compact-exports/postgres" "$source"
      - name: Verify OCI and load the selected TEST provider
        shell: bash
        run: |
          node scripts/compact-prepare-input.mjs assemble --exports "$RUNNER_TEMP/compact-exports" \
            --output "$RUNNER_TEMP/compact-oci" --source-revision "$GITHUB_SHA" \
            --archive "$RUNNER_TEMP/compact-images.oci.tar" > "$RUNNER_TEMP/compact-images.json"
          docker --context "$COMPACT_TEST_DOCKER_CONTEXT" image load --input "$RUNNER_TEMP/compact-images.oci.tar"
          node --input-type=module -e 'import fs from "node:fs"; const root=process.env.RUNNER_TEMP; const {images}=JSON.parse(fs.readFileSync(root+"/compact-images.json")); fs.writeFileSync(root+"/compact-provider-input.json",JSON.stringify({image:images.storage,command:["server","/data"]}),{flag:"wx",mode:0o600});'
      - name: Observe actual TEST provider transport
        shell: bash
        run: |
          COMPACT_PROVIDER_INPUT_FILE="$RUNNER_TEMP/compact-provider-input.json" \
          COMPACT_PROVIDER_EVIDENCE_FILE="$RUNNER_TEMP/compact-provider-evidence.json" npm run test:compact:provider
      - name: Prepare and preflight exact-source input
        shell: bash
        run: |
          npm run compact:baseline -- --output "$RUNNER_TEMP/compact-baseline" --source-revision "$GITHUB_SHA"
          node scripts/compact-prepare-input.mjs prepare --output "$RUNNER_TEMP/compact-prepared" \
            --source-revision "$GITHUB_SHA" --images "$RUNNER_TEMP/compact-images.json" \
            --oci "$RUNNER_TEMP/compact-oci" --baseline "$RUNNER_TEMP/compact-baseline" \
            --provider-evidence "$RUNNER_TEMP/compact-provider-evidence.json"
      - uses: actions/upload-artifact@v4
        with:
          name: compact-prepared-${{ github.sha }}
          path: ${{ runner.temp }}/compact-prepared
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
  compact-package:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.compact_package }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/server/package-lock.json
      - name: Check explicit input identities
        env:
          INPUT_RUN_ID: ${{ inputs.compact_input_run_id }}
          INPUT_ARTIFACT_ID: ${{ inputs.compact_input_artifact_id }}
        run: node -e "for(const k of ['INPUT_RUN_ID','INPUT_ARTIFACT_ID'])if(!/^[1-9][0-9]*$/.test(process.env[k]||'')||!Number.isSafeInteger(Number(process.env[k])))process.exit(1)"
      - name: Verify prepared artifact origin
        uses: actions/github-script@v7
        env:
          INPUT_RUN_ID: ${{ inputs.compact_input_run_id }}
          INPUT_ARTIFACT_ID: ${{ inputs.compact_input_artifact_id }}
        with:
          script: |
            try {
              const runId = Number(process.env.INPUT_RUN_ID), artifactId = Number(process.env.INPUT_ARTIFACT_ID);
              const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: runId });
              const { data: artifact } = await github.rest.actions.getArtifact({ ...context.repo, artifact_id: artifactId });
              const repoId = context.payload.repository.id, origin = artifact.workflow_run;
              if (run.id !== runId || run.status !== 'completed' || run.conclusion !== 'success' || run.head_sha !== context.sha || run.repository?.id !== repoId || run.head_repository?.id !== repoId || artifact.id !== artifactId || artifact.expired !== false || origin?.id !== runId || origin.repository_id !== repoId || origin.head_repository_id !== repoId || origin.head_sha !== context.sha) throw new Error();
            } catch { core.setFailed('COMPACT_INPUT_ORIGIN_INVALID'); }
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.compact_input_artifact_id }}
          run-id: ${{ inputs.compact_input_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/compact-input
      - run: npm ci
        working-directory: apps/server
      - run: npm run compact:test
        working-directory: apps/server
      - name: Package exact-source candidate
        working-directory: apps/server
        shell: bash
        run: |
          args=(--manifest "$RUNNER_TEMP/compact-input/release-manifest.json" --output "$RUNNER_TEMP/compact-package" --expected-revision "$GITHUB_SHA")
          if [ -d "$RUNNER_TEMP/compact-input/oci" ]; then args+=(--oci-layout "$RUNNER_TEMP/compact-input/oci"); fi
          npm run compact:package -- "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: compact-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/compact-package
          if-no-files-found: error
          include-hidden-files: true
  compact-core:
    needs: compact-package
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.compact_package && inputs.compact_qualify_core }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: apps/server
    env:
      COMPACT_TEST_DOCKER_CONTEXT: compact-core-ci
    steps:
      - uses: actions/checkout@v4
      - name: Set job-local qualification paths
        shell: bash
        run: |
          printf '%s\n' \
            "COMPACT_PACKAGE_DIRECTORY=$RUNNER_TEMP/compact-package" \
            "COMPACT_CORE_IMAGE_FILE=$RUNNER_TEMP/compact-images.json" \
            "COMPACT_CORE_EVIDENCE_DIRECTORY=$RUNNER_TEMP/compact-core-observations" \
            "COMPACT_RECOVERY_PRIVATE_DIRECTORY=$RUNNER_TEMP/compact-recovery-private" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/server/package-lock.json
      # Job-local engine: OCI imports need the containerd image store. This does
      # not reconfigure any operator's Docker Desktop or use a live environment.
      - uses: docker/setup-docker-action@v5
        with:
          context: compact-core-ci
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - uses: actions/download-artifact@v4
        with:
          name: compact-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/compact-package
      - run: npm ci
      - name: Verify exact OCI candidate before image load
        shell: bash
        run: |
          node scripts/compact-qualify-input.mjs --package "$COMPACT_PACKAGE_DIRECTORY" --expected-revision "$GITHUB_SHA" > "$COMPACT_CORE_IMAGE_FILE"
          mkdir "$COMPACT_CORE_EVIDENCE_DIRECTORY" "$COMPACT_RECOVERY_PRIVATE_DIRECTORY"
      - name: Load selected candidate images
        shell: bash
        run: docker --context "$COMPACT_TEST_DOCKER_CONTEXT" image load --input "$COMPACT_PACKAGE_DIRECTORY/images.oci.tar"
      - run: npx --no-install playwright install --with-deps chromium
      - name: Exact artifact core HTTPS and recreation
        run: npm run test:compact:core
      - name: Exact artifact bounded synthetic recovery
        run: npm run test:compact:recovery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-core-observations-${{ github.sha }}
          path: |
            ${{ runner.temp }}/compact-core-observations/*.json
            ${{ runner.temp }}/compact-recovery-private/*/sanitized-observation.json
          if-no-files-found: warn
          # Never upload private SQL/object backups, keys, env or browser traces.
  compose-config:
    # The Compose file must interpolate from nothing but .env.example plus the two
    # values a real deployment supplies — a variable added to the file without a
    # default or an example line fails here, not on the operator's machine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml against .env.example
        shell: bash
        working-directory: apps/server
        run: |
          cp .env.example .env
          docker compose config --quiet
          COMPOSE_PROFILES=local-db docker compose config --quiet
          rm -f .env

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build only (publication suspended by ADR-062)
        uses: docker/build-push-action@v6
        with:
          context: apps/server
          target: runner
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
