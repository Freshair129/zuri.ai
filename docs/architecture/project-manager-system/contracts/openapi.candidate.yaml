      x-effect-class: READ_ONLY
      x-approval: OWNER_A1_PENDING
      x-registration-status: A2_PENDING
      x-evidence-level: PROPOSED_NOT_IMPLEMENTED
      x-authorization-contract:
        unauthenticated: "401 AUTH_REQUIRED"
