components:
  securitySchemes:
    SessionAuth:
      type: apiKey
      in: cookie
      name: zuri_session
      description: Current server-resolved session. Mutations additionally require CSRF/Origin checks; no role inferred from cookie labels.
    ExecutorAuth:
      type: http
      scheme: bearer
      bearerFormat: EXECUTION_AUDIENCE
      description: Scoped executor credential. Harness report-only keys are invalid.
    InferenceAuth:
      type: http
      scheme: bearer
      bearerFormat: INFERENCE_AUDIENCE
      description: Scoped, expiring consumer key; not an upstream provider key.
  schemas:
    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - requestId
        - retryable
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 512
        message:
          type: string
          minLength: 1
          maxLength: 1000
        requestId:
          type: string
          format: uuid
        retryable:
          type: boolean
        currentVersion:
          type: integer
          minimum: 1
        fields:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - path
              - code
              - message
            properties:
              path:
                type: string
                minLength: 1
                maxLength: 512
              code:
                type: string
                minLength: 1
                maxLength: 512
              message:
                type: string
                minLength: 1
                maxLength: 500
          maxItems: 100
    ArtifactRef:
      type: object
      additionalProperties: false
      required:
        - artifactId
        - revision
        - sha256
      properties:
        artifactId:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 1
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
    MutationReceipt:
      type: object
      additionalProperties: false
      required:
        - resourceId
        - resourceType
        - version
        - requestId
      properties:
        resourceId:
          type: string
          format: uuid
        resourceType:
          type: string
          minLength: 1
          maxLength: 512
        version:
          type: integer
          minimum: 1
        requestId:
          type: string
          format: uuid
    CommandReceipt:
      type: object
      additionalProperties: false
      required:
        - commandId
        - runId
        - state
        - version
        - requestId
        - eventCursor
      properties:
        commandId:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
        state:
          type: string
          enum:
            - QUEUED
            - RUNNING
            - WAITING_APPROVAL
            - PAUSED
            - CANCELLING
            - SUCCEEDED
            - FAILED
            - CANCELLED
            - UNKNOWN
        version:
          type: integer
          minimum: 1
        requestId:
          type: string
          format: uuid
        eventCursor:
          type: string
          minLength: 1
          maxLength: 512
    Evidence:
      type: object
      additionalProperties: false
      required:
        - status
        - environment
        - observedAt
      properties:
        status:
          type: string
          enum:
            - PLANNED
            - IMPLEMENTED
            - VERIFIED
            - DEPLOYED
