          properties:
            uniqueWorkCount:
              type: integer
              minimum: 0
            workstreamCount:
              type: integer
              minimum: 0
        featureIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 0
          description: Phase A has no ProjectFeature authority and therefore always returns an empty array; a later Feature contract requires a revised schema.
