          type: boolean
        currentVersion:
          type: integer
          minimum: 1
        currentEtag:
          type: string
          minLength: 1
          maxLength: 128
        fields:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required:
              - path
              - code
              - message
            properties:
              path:
                type: string
                minLength: 1
                maxLength: 512
              code:
                type: string
                minLength: 1
                maxLength: 512
              message:
                type: string
                minLength: 1
                maxLength: 500
      description: Public refusal envelope. requestId is fresh per HTTP attempt; durable receipts use receiptId. correlationId is not a public alias.
  parameters:
    Idempotency:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: Same scoped key plus same normalized request hash returns original receipt.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
      description: Expected aggregate ETag/version.
    Csrf:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 512
      description: Session-bound token; verify Origin as well.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 1024
    PMIdempotency:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: Raw keys are isolated by method, path, trusted tenantId/businessId and principalId. A lookup is made only inside that scope. Same scoped key plus same normalized hash replays the durable receipt; same scoped key plus a changed hash returns 409 IDEMPOTENCY_KEY_REUSED. The same raw key in another scope is independent and never reveals whether a row exists there.
    PMIfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
      description: Strong aggregate ETag. Missing is 428 PRECONDITION_REQUIRED; stale is 412 VERSION_MISMATCH with currentVersion/currentEtag.
    PMCsrf:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 512
      description: Candidate X-CSRF-Token transport name only. Generic Identity API CSRF issuance, verification, same-origin check and client delivery remain NEEDS_OWNER_BINDING. Do not reuse the plugin-consent token audience or add a duplicate cookie reader.
  responses:
    DomainViewUnauthorized:
      description: No valid live session. The redacted body contains no Project, Business or domain identifiers.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/PMXRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            unauthenticated:
              summary: No valid live session
              value:
                code: AUTH_REQUIRED
                message: Authentication is required.
                requestId: a0000000-0000-4000-8000-000000000002
                retryable: false
    DomainViewNotFound:
      description: The Project is unknown, deleted, foreign-scope or hierarchy-invalid. The same redacted response prevents target enumeration.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/PMXRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
