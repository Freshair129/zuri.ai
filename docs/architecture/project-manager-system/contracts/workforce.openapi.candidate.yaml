components:
  securitySchemes:
    SessionAuth:
      type: apiKey
      in: cookie
      name: zuri_session
      description: Documentation placeholder; bind to the current server session resolver before implementation.
  schemas:
    Coverage:
      type: object
      additionalProperties: false
      properties:
        state:
          type: string
          enum:
            - COMPLETE
            - PARTIAL
            - UNKNOWN
        knownRecords: &a15
          type: integer
          minimum: 0
        eligibleRecords:
          type: integer
          minimum: 0
          nullable: true
        missing:
          type: array
          items:
            type: string
            enum:
              - ESTIMATE
              - CALENDAR
              - ASSIGNMENT
              - SCHEDULE
              - LOG
              - ACCEPTANCE
              - HISTORY
              - PERMISSION
          maxItems: 10
        scopeLabel: *a3
      required:
        - state
        - knownRecords
        - eligibleRecords
        - missing
        - scopeLabel
    Meta:
      type: object
      additionalProperties: false
      properties:
        asOf: &a16
          type: string
          format: date-time
        sourceVersion: *a3
        from: *a1
        to: *a1
        timezone: *a3
        scopeBusinessId: *a2
        coverage:
          $ref: "#/components/schemas/Coverage"
        stale:
          type: boolean
      required:
        - asOf
        - sourceVersion
        - from
        - to
        - timezone
        - scopeBusinessId
        - coverage
        - stale
    Counts:
      type: object
      additionalProperties: false
      properties:
        open: *a15
        planned: *a15
        inProgress: *a15
        blocked: *a15
        accepted: *a15
        cancelled: *a15
        unknownStatus: *a15
        unestimated: *a15
        unscheduled: *a15
      required:
        - open
        - planned
        - inProgress
        - blocked
        - accepted
        - cancelled
        - unknownStatus
        - unestimated
        - unscheduled
    Capacity:
      type: object
      additionalProperties: false
      properties:
        plannedMinutes: *a15
        availableMinutes:
          type: integer
          minimum: 0
          nullable: true
        freeMinutes:
          type: integer
          minimum: 0
          nullable: true
        overbookedMinutes:
          type: integer
          minimum: 0
          nullable: true
        loadPercent:
          type: number
          nullable: true
        state:
          type: string
          enum:
            - MEASURED
            - PARTIAL
            - UNKNOWN
            - ZERO_CAPACITY
            - NOT_APPLICABLE
      required:
        - plannedMinutes
        - availableMinutes
        - freeMinutes
        - overbookedMinutes
        - loadPercent
        - state
    DayBucket:
      type: object
      additionalProperties: false
      properties:
        date: *a1
        capacity:
          $ref: "#/components/schemas/Capacity"
        conflictCodes:
          type: array
          items: *a3
          maxItems: 20
      required:
        - date
        - capacity
        - conflictCodes
    WorkforceRow:
      type: object
      additionalProperties: false
      properties:
        subjectType:
          type: string
          enum:
            - PERSON
            - TEAM
            - UNASSIGNED
        personId:
          type: string
          format: uuid
          nullable: true
        teamId:
          type: string
          format: uuid
          nullable: true
        label: *a3
        counts:
          $ref: "#/components/schemas/Counts"
        capacity:
          $ref: "#/components/schemas/Capacity"
        coverage:
          $ref: "#/components/schemas/Coverage"
        daily:
          type: array
          items:
            $ref: "#/components/schemas/DayBucket"
          maxItems: 93
      required:
        - subjectType
        - personId
        - teamId
        - label
        - counts
        - capacity
        - coverage
        - daily
    WorkloadResponse:
      type: object
      additionalProperties: false
      properties:
        meta:
          $ref: "#/components/schemas/Meta"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/WorkforceRow"
          maxItems: 100
        totals:
          type: object
          additionalProperties: false
          properties:
            distinctPeople: *a15
            distinctOpenWork: *a15
            capacity:
              $ref: "#/components/schemas/Capacity"
            overloadedPeople: *a15
          required:
            - distinctPeople
            - distinctOpenWork
            - capacity
            - overloadedPeople
        nextCursor:
          type: string
          nullable: true
      required:
        - meta
        - rows
        - totals
        - nextCursor
    ScheduleEntry:
      type: object
      additionalProperties: false
      properties:
        allocationId: *a2
        workItemId: *a2
        personId:
          type: string
          format: uuid
          nullable: true
        creditedTeamId:
          type: string
          format: uuid
          nullable: true
        placement:
          type: string
          enum:
            - DAILY_BUDGET
            - FIXED_SLOT
            - UNASSIGNED
            - UNSCHEDULED
        startAt:
          type: string
          format: date-time
          nullable: true
        endAt:
          type: string
          format: date-time
          nullable: true
        remainingMinutes:
          type: integer
          minimum: 0
