        - placement
        - state
        - intent
      properties:
        kind:
          type: string
          enum:
            - ALLOCATION
        id:
          type: string
          format: uuid
          nullable: true
        version:
          type: integer
          minimum: 1
          nullable: true
        compatibilityProfile:
          type: string
          enum:
            - HUMAN_PERSON_V1
        resourceType:
          type: string
          enum:
            - PERSON
        workItemId:
          type: string
          format: uuid
        assignmentId:
          type: string
          format: uuid
        estimateId:
          type: string
          format: uuid
        personId:
          type: string
          format: uuid
        creditedTeamId:
          type: string
          format: uuid
          nullable: true
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        remainingMinutes:
          type: integer
          minimum: 0
        placement:
          type: string
          enum:
            - DAILY_BUDGET
            - FIXED_SLOT
        state:
          type: string
          enum:
            - DRAFT
        intent:
          type: string
          enum:
            - UPSERT
            - CANCEL
        capacityOverrideReason:
          type: string
          minLength: 1
          maxLength: 1000
          description: Required when an authorized capacity override is requested; the committed owner receipt records the exact accepted reason.
      description: DRAFT-only preview command. UPSERT targets CONFIRMED at commit; CANCEL targets CANCELLED for an existing id/version and releases its remaining capacity. Preview never writes an allocation. Existing record state vocabulary remains separate.
      allOf:
        - oneOf:
            - properties:
                intent:
                  enum:
                    - UPSERT
              oneOf:
                - properties:
                    id:
                      type: string
                      nullable: true
                      enum:
                        - null
                    version:
                      type: integer
                      nullable: true
                      enum:
                        - null
                - properties:
                    id:
                      type: string
                      format: uuid
                      nullable: false
                    version:
                      type: integer
                      minimum: 1
                      nullable: false
            - properties:
                intent:
                  enum:
                    - CANCEL
                id:
                  type: string
                  format: uuid
                  nullable: false
                version:
                  type: integer
                  minimum: 1
                  nullable: false
                remainingMinutes:
                  type: integer
                  enum:
                    - 0
  parameters:
    WFIdempotency:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: Raw keys are isolated by method, path, trusted tenantId/businessId and principalId. A lookup is made only inside that scope. Same scoped key plus same normalized hash replays the durable receipt; same scoped key plus a changed hash returns 409 IDEMPOTENCY_KEY_REUSED. The same raw key in another scope is independent and never reveals whether a row exists there.
    WFIfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
      description: Strong aggregate ETag. Missing is 428 PRECONDITION_REQUIRED; stale is 412 VERSION_MISMATCH with currentVersion/currentEtag.
    WFCsrf:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 512
      description: Candidate X-CSRF-Token transport name only. Generic Identity API CSRF issuance, verification, same-origin check and client delivery remain NEEDS_OWNER_BINDING. Do not reuse the plugin-consent token audience or add a duplicate cookie reader.
  headers:
    WFXRequestID:
      description: Fresh server-generated request UUID for this HTTP attempt; equal to the response body requestId.
      schema:
        type: string
        format: uuid
    WFETag:
      description: Strong aggregate tag in the form "<aggregate>/<uuid>/v<version>".
      schema:
        type: string
        minLength: 1
        maxLength: 128
  responses:
    WFStandardError:
      description: Typed refusal. The body uses the shared Error schema and the response carries the fresh request correlation header.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/WFXRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WFError"
    WFPreconditionRequired:
      description: If-Match is required for this version-sensitive command.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/WFXRequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/WFError"
