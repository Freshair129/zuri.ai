          type: string
          format: date-time
        auditRef:
          type: string
          minLength: 1
          maxLength: 512
        capacityOverrideReason:
          type: string
          minLength: 1
          maxLength: 1000
          description: Present and identical to the accepted reason whenever a capacity override was applied. Stable across idempotent replays; absent otherwise. For a plan with multiple overrides, use one reviewed plan-level reason shared by all affected changes.
      description: Shared durable command receipt for the PM allocation writer. receiptId and effect fields persist across idempotent replays; requestId is fresh per HTTP attempt.
    WFError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - requestId
        - retryable
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 512
        message:
          type: string
          minLength: 1
          maxLength: 1000
        requestId:
          type: string
          format: uuid
        retryable:
          type: boolean
        currentVersion:
          type: integer
          minimum: 1
        currentEtag:
          type: string
          minLength: 1
          maxLength: 128
        fields:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required:
              - path
              - code
              - message
            properties:
              path:
                type: string
                minLength: 1
                maxLength: 512
              code:
                type: string
                minLength: 1
                maxLength: 512
              message:
                type: string
                minLength: 1
                maxLength: 500
      description: Public refusal envelope. requestId is fresh per HTTP attempt; durable receipts use receiptId. correlationId is not a public alias.
    PreviewAllocationChange:
      type: object
      additionalProperties: false
      required:
        - kind
        - id
        - version
        - compatibilityProfile
        - resourceType
        - workItemId
        - assignmentId
        - estimateId
        - personId
        - startAt
