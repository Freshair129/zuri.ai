<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>UI Page Dimensional Atlas</title>
<style>
:root{color-scheme:light;--paper:#ececec;--sheet:#fff;--ink:#111;--ink2:#444;--ink3:#777;--fill:#f3f3f3;--fill2:#e6e6e6;--line:#bdbdbd;font-family:Arial,"Helvetica Neue",Helvetica,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,"Helvetica Neue",Helvetica,sans-serif}
.wrap{max-width:1760px;margin:0 auto;padding:24px max(16px,env(safe-area-inset-left,0px)) 40px max(16px,env(safe-area-inset-right,0px))}
.tb{background:var(--sheet);border:1.2px solid var(--ink);border-radius:16px;overflow:hidden;display:grid;grid-template-columns:2.2fr repeat(3,1fr);margin-bottom:16px}
.tb>div{border-right:.8px solid var(--ink);border-bottom:.8px solid var(--ink);padding:9px 13px;min-width:0}
.tb .big{grid-row:span 2;display:flex;flex-direction:column;justify-content:space-between;gap:10px}
.tb h1{font-size:clamp(26px,3.2vw,42px);line-height:1.05;margin:2px 0 0;font-weight:400;letter-spacing:.1em;text-transform:uppercase}
.lbl{text-transform:uppercase;letter-spacing:.08em;font-size:9.5px;color:var(--ink2)}
.val{font-size:13px;margin-top:3px;overflow-wrap:anywhere}
.tb .notes{grid-column:1/-1;border-right:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 24px;padding:11px 14px;font-size:11px;line-height:1.6;text-transform:uppercase;letter-spacing:.04em}
.tb .notes ol{margin:4px 0 0;padding-left:18px}
.tb .figs{grid-column:1/-1;border-right:0;border-bottom:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;padding:10px 14px}
.tb .figs>div{border-left:.8px solid var(--ink);padding-left:12px;min-width:0}
.tb .figs>div:first-child{border-left:0;padding-left:0}
.tb .figs .val{font-size:15px;font-variant-numeric:tabular-nums}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 14px;padding:10px 12px;border:1px solid #999;background:#fff}
.controls input,.controls select,.controls button{min-height:36px;border:1px solid #777;border-radius:4px;background:#fff;color:#111;padding:6px 10px;font:inherit}
.controls input{min-width:min(300px,100%);flex:1}
.controls button{cursor:pointer}
.controls button:disabled{opacity:.45;cursor:default}
.status{font-size:12px;letter-spacing:.05em;text-transform:uppercase}
.scroll{overflow-x:auto;background:var(--sheet);border:1px solid #999;box-shadow:0 1px 3px rgba(0,0,0,.12)}
svg{display:block;width:100%;min-width:1100px;height:auto}
.foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:10px;color:var(--ink2);padding:9px 2px 0;text-transform:uppercase;letter-spacing:.06em}
.u{font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;text-transform:uppercase;letter-spacing:.07em}
.border{fill:none;stroke:var(--ink);stroke-width:1.2}
.obj{fill:var(--sheet);stroke:var(--ink);stroke-width:1.5;stroke-linejoin:round}
.well{fill:var(--fill);stroke:var(--ink);stroke-width:.9}
.slot{fill:none;stroke:var(--ink2);stroke-width:.8;stroke-dasharray:4 3}
.hug{fill:var(--fill2);stroke:var(--ink);stroke-width:.9}
.solid{fill:var(--fill2);stroke:var(--ink);stroke-width:.8}
.thin{fill:none;stroke:var(--ink);stroke-width:.8}
.ph{fill:none;stroke:var(--ink3);stroke-width:.8;stroke-dasharray:14 3 3 3}
.cl{fill:none;stroke:var(--ink3);stroke-width:.7;stroke-dasharray:16 3 2 3}
.dl{stroke:var(--ink);stroke-width:.7;fill:none}
.ext{stroke:var(--ink);stroke-width:.55;fill:none}
.arrow{fill:var(--ink)}
.hl{stroke:var(--ink2);stroke-width:.7}
.dt{font:400 10.5px Arial,sans-serif;fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
.dts{font:400 9px Arial,sans-serif;fill:var(--ink2);letter-spacing:.05em;text-transform:uppercase;paint-order:stroke;stroke:#fff;stroke-width:2.5px}
.sl{font:400 8.5px Arial,sans-serif;fill:var(--ink2);letter-spacing:.06em;text-transform:uppercase}
.nt{font:400 9.5px Arial,sans-serif;fill:var(--ink);letter-spacing:.03em;text-transform:uppercase}
.nth{font:700 12px Arial,sans-serif;fill:var(--ink);letter-spacing:.06em}
.vt{font:400 11px Arial,sans-serif;fill:var(--ink);letter-spacing:.1em;text-transform:uppercase}
.vtb{font:400 17px Arial,sans-serif;fill:var(--ink);letter-spacing:.05em}
.nb{fill:#fff;stroke:var(--ink);stroke-width:.9}
.nbt{font:400 9px Arial,sans-serif;fill:var(--ink)}
.lead{stroke:var(--ink2);stroke-width:.7;fill:none}
.dot{fill:var(--ink)}
.th{font:400 9px Arial,sans-serif;fill:var(--ink);letter-spacing:.04em;text-transform:uppercase}
.tc{font:400 9px Arial,sans-serif;fill:var(--ink)}
.tbk{font:400 7.7px Arial,sans-serif;fill:var(--ink2);letter-spacing:.03em;text-transform:uppercase}
.tbh{font:700 11px Arial,sans-serif;fill:var(--ink);letter-spacing:.06em}
:focus-visible{outline:2px solid #111;outline-offset:2px}
@media(max-width:800px){.wrap{padding-top:10px}.tb{grid-template-columns:1fr 1fr}.tb .big{grid-column:1/-1;grid-row:auto}.tb .notes,.tb .figs{grid-column:1/-1}.tb .figs{grid-template-columns:repeat(2,minmax(0,1fr))}.tb .figs>div:nth-child(odd){border-left:0;padding-left:0}}
@media print{@page{size:A3 landscape;margin:8mm}body{background:#fff}.wrap{max-width:none;padding:0}.controls{display:none}.tb{margin-bottom:6mm}.scroll{overflow:visible;box-shadow:none;border:0}svg{min-width:0;width:100%}.foot{font-size:8px}}
</style>
</head>

function rebuildOptions(query){
 const q=(query||"").trim().toLowerCase(),old=PAGES[current]&&PAGES[current].route;
 select.textContent="";
 const matches=[];
 PAGES.forEach(function(p,i){if(!q||p.route.toLowerCase().indexOf(q)>=0||p.id.toLowerCase().indexOf(q)>=0){matches.push(i);const o=document.createElement("option");o.value=String(i);o.textContent=p.id+" · "+p.route;select.appendChild(o);}});
 if(!matches.length){titleBlock.textContent="";sheet.innerHTML="";const emptyTitle=add(null,"title",{id:"svg-title"});emptyTitle.textContent="No matching technical drawing sheets";const emptyDesc=add(null,"desc",{id:"svg-desc"});emptyDesc.textContent="No UI page route or drawing ID matches the current filter.";document.getElementById("footer-right").textContent="";status.textContent="0 SHEETS";document.getElementById("previous").disabled=true;document.getElementById("next").disabled=true;return;}
 let chosen=matches.indexOf(current)>=0?current:matches[0];
 if(old&&matches.some(function(i){return PAGES[i].route===old;}))chosen=matches.find(function(i){return PAGES[i].route===old;});
 select.value=String(chosen);setPage(chosen);
}
function setPage(i){
 current=Math.max(0,Math.min(PAGES.length-1,Number(i)||0));
 const p=PAGES[current];
 select.value=String(current);
 drawTitleBlock(p,current);
 renderSheet(p,current);
 status.textContent=(current+1)+" / "+PAGES.length+" SHEETS";
 const selectedPosition=select.selectedIndex;
 document.getElementById("previous").disabled=selectedPosition<=0;
 document.getElementById("next").disabled=selectedPosition<0||selectedPosition>=select.options.length-1;
}
function stepPage(delta){
 const nextPosition=select.selectedIndex+delta;
 if(nextPosition>=0&&nextPosition<select.options.length)setPage(Number(select.options[nextPosition].value));
}
filter.addEventListener("input",function(){rebuildOptions(filter.value);});
select.addEventListener("change",function(){setPage(Number(select.value));});
document.getElementById("previous").addEventListener("click",function(){stepPage(-1);});
document.getElementById("next").addEventListener("click",function(){stepPage(1);});
document.getElementById("print").addEventListener("click",function(){window.print();});
document.addEventListener("keydown",function(e){if(e.altKey&&e.key==="ArrowRight"){e.preventDefault();stepPage(1);}if(e.altKey&&e.key==="ArrowLeft"){e.preventDefault();stepPage(-1);}});
rebuildOptions("");
const initial=PAGES.findIndex(function(p){return p.route==="/overview";});
setPage(initial>=0?initial:0);
})();
