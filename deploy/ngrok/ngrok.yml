# ngrok agent configuration mounted read-only into the `ngrok` service
# (docker-compose.yml). No credential lives here: the authtoken is read by the
# agent from the NGROK_AUTHTOKEN environment variable, and the tunnel itself is
# declared on the command line (`ngrok http web:3000 [--domain=...]`) so the
# static-domain / temporary-URL choice stays in .env.
#
# `version` here is the CONFIG FILE schema, not the agent's CLI major version —
# confusingly, both are called "3". `ngrok/ngrok:3` (agent v3.39, verified
# 2026-09-04) rejects `web_addr`/`log_level` under `version: "3"` with
# "field web_addr not found in type config.v3yamlConfig"; `version: "2"` is the
# schema that still carries these fields, and this same agent binary accepts it
# (`ngrok config check` against both was how this was confirmed). Do not "fix"
# this back to "3" without re-checking with the image's actual ngrok version.
version: "2"
# The inspection UI/API must bind to all container interfaces to be reachable on
# the host at 127.0.0.1:4040 (the default 127.0.0.1 would be the container's own
# loopback). Compose publishes it on the host loopback only.
web_addr: 0.0.0.0:4040
log_level: info
